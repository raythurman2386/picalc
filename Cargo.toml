[package]
name = "picalc"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A desktop calculator built with GPUI Kit"
repository = "https://github.com/raythurman2386/picalc"
readme = "README.md"
keywords = ["calculator", "gpui"]
categories = ["gui"]

[lib]
name = "picalc"
path = "src/lib.rs"

[[bin]]
name = "picalc"
path = "src/main.rs"

[dependencies]
anyhow = "1"
directories = "6"
gpui-kit = "0.6"
notify = "8"

[profile.release]
lto = "thin"
strip = "symbols"

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 2